name: AI CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      USE_REAL_LLM: "false"
      REWRITE_WITH_LLM: "false"
      USE_REAL_EMBEDDINGS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install offline test dependencies
        run: python -m pip install fastapi==0.116.1 pydantic==2.11.7 python-dotenv==1.1.1 httpx==0.28.1 pytest==8.4.2
      - name: Install vector math for mock embedding tests (no model download)
        run: python -m pip install 'numpy>=1.26,<3'
      - name: Run tests without paid providers or credentials
        run: python -m pytest
